tesla_charge_forty:
  alias: Tesla, Charge to 40%
  description: Ladda Tesla till 40% SoC - stoppar sessionen när SoC når 40%, med beräknad
    energimängd hos ChargeNode som reserv
  icon: mdi:battery-40
  mode: single
  sequence:
  - alias: Check SoC is below 40
    condition: numeric_state
    entity_id: sensor.tesla_battery_level
    below: 40
  - alias: Turn off household consumers
    action: script.turn_on
    data: {}
    target:
      entity_id: script.ladda_bilen_uppstart
  - alias: Start charging to 40%
    action: retry.actions
    data:
      sequence:
      - action: rest_command.cn_charge_tesla_to_soc
        data:
          target_soc: 40
  - alias: Notify Charge starting
    action: notify.rickards_devices
    data:
      title: "\U0001F698Eazy börjar ladda"
      message: "⚡SoC:    {{states(\"sensor.tesla_battery_level\")}}% \U0001F3AF40%\\n\n\U0001F4B6Priset:
        {{states(\"sensor.template_nordpool_current_price_vat\")}} kr\\n\n{{now().strftime('%d
        %H:%M')}}"
      data:
        sticky: true
        tag: car_1_charging
        clickAction: /lovelace/tesla
        channel: ev
  - alias: Wait for the session to appear at ChargeNode
    delay:
      minutes: 2
  - alias: Get SessionId
    action: homeassistant.update_entity
    target:
      entity_id: sensor.charge_rya_sessionid
  - alias: Wait for SoC 40% or the car to be unplugged
    wait_template: "{{ states('sensor.tesla_battery_level')|float(0) >= 40\n   or
      is_state('binary_sensor.tesla_plugged_in', 'off') }}"
    timeout:
      hours: 8
    continue_on_timeout: false
  - alias: Stop charging unless the car was unplugged
    if:
    - condition: not
      conditions:
      - condition: state
        entity_id: binary_sensor.tesla_plugged_in
        state: 'off'
    then:
    - action: script.ladda_tesla_stoppa
