---
  # This automation simulates the use of the IKEA TRADFRI Remote control
  # connected through ZHA.
  
  # | Button   | Action              |
  # | -------- | ------------------- |
  # | Power    | Toggle the light    |
  # | Dim-Up   | Increase brightness |
  # | Dim-Down | Decrease brightness |
  # | Right    | Next preset         |
  # | Left     | Previous preset     |
  
  # Create an input_select (Dropdown) helper and add rgb_color preset options.
  # You can copy/paste the rgb_color value from the Developer Tools > States.
  # For example, on the States tab you see "rgb_color: 38.222, 52.941", then
  # you can add "(38.222, 52.941)" as an option to the input_select Helper.
  # You can also add a comment (i.e. name of the preset) like this
  # "(38.222, 52.941) # default" to help you remember what the values mean.
  # Example presets:
  #   - (360, 100) # red
  #   - (120, 100) # green
  #   - (225, 100) # blue
  #   - (38.222, 52.941) # default

  # LOCAL MODIFICATION (not upstream, source_url removed so a re-import does
  # not overwrite it): an option ending in K, such as "3984K # default", is
  # sent as color_temp_kelvin instead of rgb_color. Some lights (AwoX) render
  # warm whites wrong in xy mode but get them right through color temperature.
  # The power long-press uses 3984 K instead of rgb_color [255,205,165].
  
  blueprint:
    name: ZHA - IKEA TRADFRI - 5 Button Remote - Preset Colors
    description: This automation simulates the use of the IKEA TRADFRI remote control
      connected through ZHA.
    domain: automation
    input:
      remote:
        name: IKEA TRADFRI remote control
        description: Select the remote control you wish to use.
        selector:
          device:
            integration: zha
            manufacturer: IKEA of Sweden
            model: TRADFRI remote control
            multiple: false
      light:
        name: Light
        description: Select the light entity you wish to control.
        selector:
          entity:
            domain: light
            multiple: false
      speed:
        name: Speed
        description: The speed in which to update the light when the button is held.
        selector:
          number:
            min: 100.0
            max: 1000.0
            step: 100.0
            unit_of_measurement: milliseconds
            mode: slider
        default: 500
      preset:
        name: Helper
        description: Select the helper entity with you pre defined settings.
        selector:
          entity:
            domain: input_select
            multiple: false
  mode: restart
  max_exceeded: silent
  variables:
    var_preset: !input preset
    var_speed: !input speed
  trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote
  action:
  # Select the last option of the preset if it is unknown.
  - choose:
    - conditions:
      - condition: state
        entity_id: !input preset
        state: unknown
      sequence:
      - service: input_select.select_last
        target:
          entity_id: !input preset
  - choose:    
    # Short-Press on the power button.
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == "toggle" }}'
      sequence:
      - service: light.toggle
        target:
          entity_id: !input light
    # Long-Press on the power button.
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == "move_to_level_with_on_off"
          }}'
      sequence:
      - service: light.turn_on
        target:
          entity_id: !input light
        data:
          brightness: 152
          color_temp_kelvin: 3984
    # Short-Press on the dim-up button.
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == "step_with_on_off" }}'
      sequence:
      - service: light.turn_on
        target:
          entity_id: !input light
        data:
          brightness_step_pct: 20
          transition: '{{ (var_speed / 1000)|float }}'
    # Long-Press on the dim-up button.
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == "move_with_on_off" }}'
      sequence:
      - repeat:
          while: []
          sequence:
          - service: light.turn_on
            target:
              entity_id: !input light
            data:
              brightness_step_pct: 10
              transition: '{{ (var_speed / 1000)|float }}'
          - delay:
              milliseconds: !input speed
    # Short-Press on the dim-down button.
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == "step" }}'
      sequence:
      - service: light.turn_on
        target:
          entity_id: !input light
        data:
          brightness_step_pct: -20
          transition: '{{ (var_speed / 1000)|float }}'
    # Long-Press on the dim-down button.
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == "move" }}'
      sequence:
      - repeat:
          while: []
          sequence:
          - service: light.turn_on
            target:
              entity_id: !input light
            data:
              brightness_step_pct: -10
              transition: '{{ (var_speed / 1000)|float }}'
          - delay:
              milliseconds: !input speed
    # Short-Press on the color-up button.
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == "press" }}'
      - condition: template
        value_template: '{{ trigger.event.data.args == [256,13,0] }}'
      sequence:
      - service: input_select.select_next
        target:
          entity_id: !input preset
        data:
          cycle: true
      - service: light.turn_on
        target:
          entity_id: !input light
        data: >-
          {% set p = states(var_preset).split('#')[0] | trim %}
          {% set d = {'transition': (var_speed / 1000) | float} %}
          {% if p.endswith('K') %}{{ dict(d, color_temp_kelvin=p[:-1] | int) }}
          {% else %}{{ dict(d, rgb_color=p.replace('(', '[').replace(')', ']') | from_json) }}{% endif %}
  
    # Long-Press on the color-up button.
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == "hold" }}'
      - condition: template
        value_template: '{{ trigger.event.data.args == [3328,0] }}'
      sequence:
      - repeat:
          while: []
          sequence:
          - service: input_select.select_next
            target:
              entity_id: !input preset
            data:
              cycle: true
          - service: light.turn_on
            target:
              entity_id: !input light
            data: >-
              {% set p = states(var_preset).split('#')[0] | trim %}
              {% set d = {'transition': (var_speed / 1000) | float} %}
              {% if p.endswith('K') %}{{ dict(d, color_temp_kelvin=p[:-1] | int) }}
              {% else %}{{ dict(d, rgb_color=p.replace('(', '[').replace(')', ']') | from_json) }}{% endif %}
          - delay:
              milliseconds: !input speed
  
    # Short-Press on the color-down button.
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == "press" }}'
      - condition: template
        value_template: '{{ trigger.event.data.args == [257,13,0] }}'
      sequence:
      - service: input_select.select_previous
        target:
          entity_id: !input preset
        data:
          cycle: true
      - service: light.turn_on
        target:
          entity_id: !input light
        data: >-
          {% set p = states(var_preset).split('#')[0] | trim %}
          {% set d = {'transition': (var_speed / 1000) | float} %}
          {% if p.endswith('K') %}{{ dict(d, color_temp_kelvin=p[:-1] | int) }}
          {% else %}{{ dict(d, rgb_color=p.replace('(', '[').replace(')', ']') | from_json) }}{% endif %}
  
    # Long-Press on the color-down button.
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == "hold" }}'
      - condition: template
        value_template: '{{ trigger.event.data.args == [3329,0] }}'
      sequence:
      - repeat:
          while: []
          sequence:
          - service: input_select.select_previous
            target:
              entity_id: !input preset
            data:
              cycle: true
          - service: light.turn_on
            target:
              entity_id: !input light
            data: >-
              {% set p = states(var_preset).split('#')[0] | trim %}
              {% set d = {'transition': (var_speed / 1000) | float} %}
              {% if p.endswith('K') %}{{ dict(d, color_temp_kelvin=p[:-1] | int) }}
              {% else %}{{ dict(d, rgb_color=p.replace('(', '[').replace(')', ']') | from_json) }}{% endif %}
          - delay:
              milliseconds: !input speed
  
    # Any other event will cancel the repeat loops.
    default: []
  